name: pre-commit autoupdate

# Dependabot doesn't cover .pre-commit-config.yaml, so this refreshes the
# remote hook revs weekly and opens a PR with the diff. ruff and prettier are
# `local` hooks that run the project-pinned versions, so this only ever touches
# pre-commit/pre-commit-hooks.
#
# PRs opened with GITHUB_TOKEN don't fire `pull_request` events in other
# workflows, so the last step dispatches ci.yml on the PR branch explicitly.
# Required status checks are evaluated per commit, so that run satisfies
# branch protection just like a pull_request-triggered one would.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch ci.yml on the PR branch

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"

      - name: Run pre-commit autoupdate
        run: uvx pre-commit autoupdate

      - name: Open PR with updated hook revs
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update pre-commit hook revisions"
          branch: chore/pre-commit-autoupdate
          delete-branch: true
          title: "Update pre-commit hook revisions"
          labels: dependencies
          body: |
            Automated `pre-commit autoupdate` run. CI is dispatched on this
            branch by the same workflow; wait for the checks before merging.

      - name: Trigger CI on the PR branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --ref "$BRANCH"
        env:
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
