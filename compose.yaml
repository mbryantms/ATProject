# Local development only. Production runs on Railway (see DEPLOYMENT.md).
# Credentials match the default DATABASE_URL in .env.example.
#
# Usage:
#   docker compose up -d        # start Postgres + Redis
#   docker compose stop         # pause (keeps data)
#   docker compose start        # resume
#   docker compose down -v      # remove containers + volumes (nukes data)
#
# Redis is used by Celery (broker + result backend) and by Django's cache
# framework. Tests don't need it — settings.py forces
# CELERY_TASK_ALWAYS_EAGER when ``manage.py test`` is detected — but the
# dev server does whenever a signal enqueues an async task.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: atproject
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/18/docker and now
      # declares /var/lib/postgresql as its VOLUME (it was .../data on v17).
      # Mount the named volume at the parent so data persists. Existing local
      # volumes from a pg17 layout must be recreated once: docker compose down -v.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d atproject"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
