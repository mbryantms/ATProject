{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a class="pagination-link pagination-prev" href="{% querystring page=page_obj.previous_page_number %}" rel="prev">← Previous</a>
    {% else %}
      <span class="pagination-link pagination-disabled" aria-hidden="true">← Previous</span>
    {% endif %}
    <span class="pagination-status">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="pagination-link pagination-next" href="{% querystring page=page_obj.next_page_number %}" rel="next">Next →</a>
    {% else %}
      <span class="pagination-link pagination-disabled" aria-hidden="true">Next →</span>
    {% endif %}
  </nav>
{% endif %}
